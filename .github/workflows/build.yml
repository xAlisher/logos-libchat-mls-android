name: build-android-arm64

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/**"
      - "wrapper/**"
      - "patches/**"
      - ".github/workflows/build.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc || true
          df -h /

      - name: Install NDK r27
        run: |
          echo "y" | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" "ndk;27.1.12297006"
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/27.1.12297006" >> "$GITHUB_ENV"

      - name: Install rust android target
        run: rustup target add aarch64-linux-android

      - name: Build liblogoschat.so (arm64)
        run: bash scripts/build-android-arm64.sh
        env:
          BUILD_DIR: ${{ github.workspace }}/libchat-build

      - name: Verify exported symbols on-runner
        run: |
          TC=$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64
          "$TC/bin/aarch64-linux-android30-clang" scripts/smoke.c -o /tmp/smoke -ldl
          echo "smoke driver cross-compiled OK (dlopen path exercised on-device, not on the runner)"
          "$TC/bin/llvm-nm" -D --defined-only out/arm64-v8a/liblogoschat.so | grep ' logoschat_'

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: logos-libchat-mls-android-arm64-v8a
          path: out/arm64-v8a/
          if-no-files-found: error
